[workspace]
resolver = "2"
members = [
    "crates/ledgit-core",
    "crates/ledgit-sqlite",
    "crates/ledgit-cli",
    "crates/ledgit-gui",
    "crates/ledgit-plot",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
ledgit-core = { path = "crates/ledgit-core" }
ledgit-sqlite = { path = "crates/ledgit-sqlite" }
ledgit-plot = { path = "crates/ledgit-plot" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
eframe = { version = "0.33", features = ["persistence"] }
egui = "0.33"
# Tables: columns sized to their content, clipped past a cap, resizable, with
# a scrolling body. Same release train as egui, so pinned alongside it.
egui_extras = { version = "0.33", default-features = false }
rfd = "0.15"
egui_plot = "0.34"
# Rasterises exported charts. Text only: the font comes from egui's own
# bundle, so a PNG looks the same on every machine and needs no system fonts.
resvg = { version = "0.45", default-features = false, features = ["text"] }
epaint_default_fonts = "0.33"

[profile.release]
opt-level = 3
lto = "thin"

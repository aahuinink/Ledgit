[package]
name = "ledgit-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Desktop front end for Ledgit."

[[bin]]
name = "ledgit-gui"
path = "src/main.rs"

[dependencies]
ledgit-core = { workspace = true }
ledgit-sqlite = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
rfd = { workspace = true }
egui_plot = { workspace = true }
resvg = { workspace = true }
ledgit-plot = { workspace = true }
serde = { workspace = true }

# Only build.rs uses these. Both compile anywhere, so the icon code is checked
# on every platform even though it only runs when targeting Windows.
[build-dependencies]
resvg = { workspace = true }
winresource = { version = "0.1", default-features = false }
